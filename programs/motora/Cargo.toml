[package]
name = "motora"
version = "0.1.0"
description = "MOTORA - verifiable motorcycle maintenance histories and linked warranties on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "motora"

[features]
no-entrypoint = []
no-docs = []
default = []
cpi = ["no-entrypoint"]
test-bpf = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = ["anchor-lang/anchor-debug"]

[dependencies]
anchor-lang = { version = "0.32.2", features = ["init-if-needed"] }
